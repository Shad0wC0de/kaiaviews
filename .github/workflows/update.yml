name: Update YouTube Metadata

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create cookies file
        run: |
          echo "${{ secrets.YT_COOKIES }}" > cookies.txt

      - name: Run script
        run: |
          python YT_Tracking.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add *.csv

          git diff --cached --quiet || git commit -m "Auto update metadata"
          git push
